<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JanusDiceLab</title>
  <style>
    body { background: #f9fafb; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: system-ui, sans-serif; color: #1a2a2a; }
    #mount { min-height: 200px; display: grid; place-items: center; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>JanusDiceLab</h1>
    <p>Probá el dado interactivo.</p>
    <div id="mount"></div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module">
    import { JanusDiceLab } from './src/trivia/JanusDiceLab.js';

    JanusDiceLab({
      mount: document.getElementById('mount'),
      onResult: (value) => {
        document.getElementById('status').textContent = 'Salió ' + value + '.';
      }
    });
  </script>
</body>
</html>
